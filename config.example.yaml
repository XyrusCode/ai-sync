# ai-sync configuration TEMPLATE.
#
#   1. Copy this file to  config.local.yaml  (which is gitignored).
#   2. Adjust paths only if your tools live somewhere non-default.
#
# ${USERPROFILE} expands to your Windows home dir (e.g. C:\Users\<you>), so this
# template is machine-neutral: no username, no absolute paths, no secrets ever
# live in the committed repo. config.local.yaml stays on your machine only.

# Canonical hub — the local source of truth. NEVER committed.
data_dir: "${USERPROFILE}/.ai-sync"

# Conflict resolution across tools: currently only "newest-wins".
conflict: newest-wins

# Shared cross-tool memory anchor already used by every 'memory' MCP server.
mcp_memory_json: "${USERPROFILE}/mcp-memory.json"

# ---------------------------------------------------------------------------
# Agents canonical repo — the shared ~/.agents checkout.
# When set, this becomes the highest-priority source for global AGENTS.md and
# the canonical MCP server catalog (mcp/servers.json). ai-sync reads from here
# and fans out to every tool, rather than relying purely on newest-wins among
# the tool-native copies.
# ---------------------------------------------------------------------------
agents_repo: "${USERPROFILE}/Desktop/XyrusCode/agents"

# ---------------------------------------------------------------------------
# Per-tool wiring. enabled: false skips a tool completely.
# Any key left absent simply means "this tool has no such surface".
# ---------------------------------------------------------------------------
tools:
  copilot:
    enabled: true
    # GitHub Copilot CLI — the session orchestrator this repo lives in.
    # History is in a local SQLite store that also backs the session cloud sync.
    history_db: "${USERPROFILE}/.copilot/session-store.db"
    inject_history: true      # SQLite insert — write other tools' sessions here
    process_names: ["copilot", "github-copilot", "copilot-agent"]

  claude:
    enabled: true
    skills_dirs:
      - "${USERPROFILE}/.claude/skills"
      - "${USERPROFILE}/.agents/skills"
    memory_file: "${USERPROFILE}/.claude/CLAUDE.md"
    mcp_json: "${USERPROFILE}/.claude.json"          # servers under "mcpServers"
    history_dir: "${USERPROFILE}/.claude/projects"
    inject_history: true      # file-based transcripts — high confidence
    process_names: ["claude"]

  opencode:
    enabled: true
    skills_dirs: ["${USERPROFILE}/.config/opencode/skills"]
    memory_file: "${USERPROFILE}/.config/opencode/AGENTS.md"
    mcp_json: "${USERPROFILE}/.config/opencode/opencode.json"   # servers under "mcp"
    mcp_key: "mcp"
    history_db: "${USERPROFILE}/.local/share/opencode/opencode.db"
    inject_history: true      # SQLite insert — inject sessions from other tools into opencode
    process_names: ["opencode"]

  codex:
    enabled: true
    skills_dirs: ["${USERPROFILE}/.codex/skills"]
    memory_file: "${USERPROFILE}/.codex/AGENTS.md"
    mcp_toml: "${USERPROFILE}/.codex/config.toml"               # [mcp_servers.*]
    history_dir: "${USERPROFILE}/.codex/sessions"
    session_index: "${USERPROFILE}/.codex/session_index.jsonl"
    inject_history: true      # file-based rollouts — high confidence
    process_names: ["codex"]

  gemini:
    enabled: true
    memory_file: "${USERPROFILE}/.gemini/GEMINI.md"
    mcp_json: "${USERPROFILE}/.gemini/config/mcp_config.json"   # servers under "mcpServers"
    history_tmp: "${USERPROFILE}/.gemini/tmp"
    projects_json: "${USERPROFILE}/.gemini/projects.json"
    inject_history: true      # per-project JSON chats — hash verified on-machine
    process_names: ["gemini"]

  antigravity:
    enabled: true
    mcp_json: "${USERPROFILE}/.gemini/antigravity-ide/mcp_config.json"
    conversations_dir: "${USERPROFILE}/.gemini/antigravity-ide/conversations"
    process_names: ["Antigravity"]
    inject_history: false   # protobuf schema not decoded → export/ingest-only

  cursor:
    enabled: true
    skills_dirs: ["${USERPROFILE}/.cursor/skills-cursor"]
    mcp_json: "${USERPROFILE}/.cursor/mcp.json"                 # created if absent
    global_vscdb: "${USERPROFILE}/AppData/Roaming/Cursor/User/globalStorage/state.vscdb"
    inject_history: false     # state.vscdb has encryption-key fields — deferred/opt-in
    process_names: ["Cursor"]

  kimi:
    enabled: true
    # Kimi Work/Desktop AI agent (Moonshot AI). Skills use SKILL.md format.
    # History is in conversations.sqlite with messages in wire.jsonl files.
    skills_dirs: ["${APPDATA}/kimi-desktop/daimon-share/daimon/skills"]
    memory_file: "${APPDATA}/kimi-desktop/daimon-share/daimon/agents/main/memory/vault/index.md"
    history_db: "${APPDATA}/kimi-desktop/daimon-share/daimon/agents/main/sessions/hosted-logical/conversations.sqlite"
    sessions_dir: "${APPDATA}/kimi-desktop/daimon-share/daimon/runtime/kimi-code/home/sessions"
    process_names: ["Kimi"]
    inject_history: false     # SQLite-based — opt-in after validating

  devin:
    enabled: true
    # Devin reads project AGENTS.md; its knowledge/MCP are cloud-side.
    history_db: "${USERPROFILE}/AppData/Roaming/Devin/cli/sessions.db"
    process_names: ["Devin", "devin-desktop"]
    inject_history: false   # cloud-driven; local sessions.db is empty by default

  kiro:
    enabled: true
    # Kilo Gateway CLI — free-tier AI reviewer (kiro-cli).
    # The ~/.agents install.sh symlinks AGENTS.md -> KIRO.md.
    memory_file: "${USERPROFILE}/.kiro/KIRO.md"
    mcp_json: "${USERPROFILE}/.kiro/mcp.json"
    # Kiro history is JSONL per-project, similar to Claude's layout.
    history_dir: "${USERPROFILE}/.kiro/projects"
    inject_history: false      # JSONL-based — opt-in after validating schema
    process_names: ["kiro-cli", "kiro"]

  qwen:
    enabled: true
    # Qwen CLI (Alibaba) — free-tier reviewer.
    memory_file: "${USERPROFILE}/.qwen/QWEN.md"
    mcp_json: "${USERPROFILE}/.qwen/mcp_config.json"
    history_dir: "${USERPROFILE}/.qwen/sessions"
    inject_history: false      # JSONL-based — opt-in after validating
    process_names: ["qwen"]

  windsurf:
    enabled: true
    # Windsurf AI IDE — uses .cursorrules (symlinked to AGENTS.md).
    # MCP config in the IDE's code workspace storage.
    memory_file: "${USERPROFILE}/.windsurf-server/.cursorrules"
    mcp_json: "${USERPROFILE}/.windsurf-server/mcp.json"
    skills_dirs: ["${USERPROFILE}/.windsurf-server/skills"]
    process_names: ["windsurf", "windsurf-server"]
    inject_history: false      # deferred — schema unknown

# ---------------------------------------------------------------------------
# agent-limits data directory (from ~/.agents repo).
# When set, the agent_limits pass reads rate-limit event logs and status
# caches into the hub for reporting alongside history.
# ---------------------------------------------------------------------------
agent_limits_data: "${USERPROFILE}/.agents/data/agent-limits"

# ---------------------------------------------------------------------------
# Secret classification. A field is NEVER written/copied to another tool if its
# KEY matches secret_field_keys OR its VALUE matches any secret_value_patterns.
# Existing secrets already in a tool's config are always left untouched.
# ---------------------------------------------------------------------------
# NOTE: 'env' is intentionally NOT listed — env blocks routinely hold non-secret
# config (MEMORY_FILE_PATH, PLAYWRIGHT_BROWSERS_PATH). Real secrets inside env are
# still caught by secret_value_patterns below. Listed keys mask any bare,
# non-${indirected} leaf value as a safety net.
secret_field_keys:
  - headers
  - http_headers
  - Authorization
  - authorization
  - token
  - bearer_token
  - bearer_token_env_var
  - api_key
  - apiKey
  - password
  - accessToken
  - refreshToken

# Token-SHAPE patterns only: they match real credential values, not structural
# words. ${ENV} indirection (e.g. "Bearer ${GITHUB_TOKEN}") is preserved as-is.
secret_value_patterns:
  - "ghp_[A-Za-z0-9]{20,}"           # GitHub personal token
  - "github_pat_[A-Za-z0-9_]{20,}"   # GitHub fine-grained PAT
  - "gho_[A-Za-z0-9]{20,}"           # GitHub OAuth token
  - "sbp_[A-Za-z0-9]{20,}"           # Supabase token
  - "sk-[A-Za-z0-9]{20,}"            # OpenAI-style key
  - "AIza[A-Za-z0-9_\\-]{20,}"       # Google API key
  - "AQ\\.[A-Za-z0-9_\\-]{20,}"      # Stitch / Google AQ token
  - "xox[baprs]-[A-Za-z0-9-]{10,}"   # Slack token
  - "eyJ[A-Za-z0-9_\\-]{10,}\\.[A-Za-z0-9_\\-]{10,}"  # JWT
